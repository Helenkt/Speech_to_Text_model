      .section-label { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #7fd8e7; letter-spacing: 2px; }
      .node-title { font: 650 17px 'Segoe UI', Arial, sans-serif; fill: #f3f7fb; }
      .node-sub { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #9fb1c4; }
      .small { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #b9c7d5; }
      .tag { font: 700 11px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; }
      .region { fill: #091522; stroke: #274058; stroke-width: 1.5; stroke-dasharray: 7 8; rx: 18; }
      .node { fill: #111f2e; stroke: #31506b; stroke-width: 1.5; rx: 12; filter: url(#shadow); }
      .node-cyan { fill: #10232e; stroke: #39d0e6; stroke-width: 1.8; rx: 12; filter: url(#shadow); }
      .node-purple { fill: #1b1830; stroke: #9b87f5; stroke-width: 1.8; rx: 12; filter: url(#shadow); }
      .node-orange { fill: #2a2015; stroke: #f6a84b; stroke-width: 1.8; rx: 12; filter: url(#shadow); }
      .node-green { fill: #10271f; stroke: #43d19e; stroke-width: 1.8; rx: 12; filter: url(#shadow); }
      .node-red { fill: #2b171d; stroke: #ec7181; stroke-width: 1.8; rx: 12; filter: url(#shadow); }
      .store { fill: #101b2a; stroke: #6b87a3; stroke-width: 1.5; rx: 6; filter: url(#shadow); }
      .flow-cyan { fill: none; stroke: #39d0e6; stroke-width: 2.4; marker-end: url(#arrow-cyan); }
      .flow-purple { fill: none; stroke: #9b87f5; stroke-width: 2.4; marker-end: url(#arrow-purple); }
      .flow-orange { fill: none; stroke: #f6a84b; stroke-width: 2.4; marker-end: url(#arrow-orange); }
      .flow-green { fill: none; stroke: #43d19e; stroke-width: 2.4; marker-end: url(#arrow-green); }
